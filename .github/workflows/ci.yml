name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check ES modules
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            # Copy to .mjs so node parses it as an ES module, matching how
            # Foundry loads esmodules entries.
            cp "$f" /tmp/check.mjs
            if node --check /tmp/check.mjs; then
              echo "OK   $f"
            else
              echo "FAIL $f" >&2
              status=1
            fi
          done < <(find scripts -name '*.js' -print0)
          exit "$status"

      - name: Validate module.json
        run: |
          set -euo pipefail
          jq -e . module.json > /dev/null

          id="$(jq -r .id module.json)"
          expected_id="${GITHUB_REPOSITORY#*/}"
          if [ "$id" != "$expected_id" ]; then
            echo "module id '$id' does not match repository name '$expected_id'" >&2
            exit 1
          fi

          version="$(jq -r .version module.json)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version '$version' is not plain semver" >&2
            exit 1
          fi

          jq -e '.compatibility.minimum' module.json > /dev/null

          # Every declared script/style/language file must exist in the repo.
          while IFS= read -r f; do
            if [ ! -f "$f" ]; then
              echo "module.json references missing file: $f" >&2
              exit 1
            fi
          done < <(jq -r '(.esmodules[]?, .styles[]?, .languages[]?.path?)' module.json)

          # Manifest and download URLs must point at this repository's releases,
          # or the Foundry installer will fetch someone else's package.
          for field in manifest download; do
            url="$(jq -r ".$field" module.json)"
            case "$url" in
              "https://github.com/${GITHUB_REPOSITORY}/releases/"*) ;;
              *) echo "$field URL does not point at ${GITHUB_REPOSITORY} releases: $url" >&2; exit 1 ;;
            esac
          done

          echo "module.json OK (id=$id version=$version)"
