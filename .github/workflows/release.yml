name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag matches module.json version
        run: |
          MODULE_VERSION="$(jq -r .version module.json)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MODULE_VERSION" != "$TAG_VERSION" ]; then
            echo "module.json version ($MODULE_VERSION) does not match tag ($TAG_VERSION)" >&2
            exit 1
          fi

      - name: Pin download URL to this release
        run: |
          # The manifest URL stays on releases/latest so Foundry's update
          # check finds new versions; the download URL is pinned so the
          # package registry can install this exact version.
          jq --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip" \
             '.download = $url' module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Build module archive
        run: zip -r module.zip . -x "*.git*" -x ".github/*"

      - name: Build release notes
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## What's changed"
            echo ""
            # Commit subjects since the previous tag, skipping commits that
            # only touch CI/workflow files — players don't care about those.
            if [ -n "$PREV" ]; then
              RANGE="$PREV..${GITHUB_REF_NAME}"
            else
              RANGE="${GITHUB_REF_NAME}"
            fi
            git log --pretty='- %s' "$RANGE" -- . ':!.github'
            echo ""
            if [ -n "$PREV" ]; then
              echo "**Full changelog:** [\`$PREV...${GITHUB_REF_NAME}\`](https://github.com/${GITHUB_REPOSITORY}/compare/$PREV...${GITHUB_REF_NAME})"
              echo ""
            fi
            echo "## Install"
            echo ""
            echo "Paste this manifest URL into Foundry's **Install Module** dialog:"
            echo ""
            echo '```'
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/module.json"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            module.json
            module.zip

      - name: Publish to Foundry package registry
        if: ${{ env.FOUNDRY_RELEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          BODY="$(jq -n \
            --arg id "$(jq -r .id module.json)" \
            --arg version "$(jq -r .version module.json)" \
            --arg manifest "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.json" \
            --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --argjson compat "$(jq .compatibility module.json)" \
            '{id: $id, release: {version: $version, manifest: $manifest, notes: $notes, compatibility: $compat}}')"
          RESPONSE="$(curl -s -w '\n%{http_code}' -X POST "https://foundryvtt.com/_api/packages/release_version/" \
            -H "Content-Type: application/json" \
            -H "Authorization: ${FOUNDRY_RELEASE_TOKEN}" \
            -d "$BODY")"
          STATUS="$(printf '%s' "$RESPONSE" | tail -1)"
          printf '%s\n' "$RESPONSE" | sed '$d'
          if [ "$STATUS" != "200" ]; then
            echo "Foundry registry publish failed with HTTP $STATUS" >&2
            exit 1
          fi
