name: Pre-launch cleanup

# One-shot manual workflow: remove the v1.2.x pre-launch releases and tags
# ahead of the public v1.0.0 relaunch. Delete this file after running it.

on: workflow_dispatch

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const tag of ["v1.2.1", "v1.2.0"]) {
              try {
                const rel = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
                await github.rest.repos.deleteRelease({ ...context.repo, release_id: rel.data.id });
                core.info(`deleted release ${tag}`);
              } catch (e) {
                core.info(`release ${tag}: ${e.status ?? e.message}`);
              }
              try {
                await github.rest.git.deleteRef({ ...context.repo, ref: `tags/${tag}` });
                core.info(`deleted tag ${tag}`);
              } catch (e) {
                core.info(`tag ${tag}: ${e.status ?? e.message}`);
              }
            }
